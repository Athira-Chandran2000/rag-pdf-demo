name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/test_pipeline_components.py

      - name: Smoke test (API Startup)
        run: |
          # Start uvicorn in background
          GROQ_API_KEY="mock_key" uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          PID=$!
          
          echo "Waiting for API to start (up to 60s)..."
          for i in {1..12}; do
            if curl -s http://localhost:8000/health | grep -q "ready\|loading"; then
              echo "✅ API is up!"
              kill $PID
              exit 0
            fi
            echo "Retrying in 5s... ($i/12)"
            sleep 5
          done
          
          echo "❌ API failed to start within 60s"
          kill $PID
          exit 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
          git push --force hf main
